<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coal Algo-Trader v1.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --inv-green: #00a651; --inv-red: #ed1c24; --inv-blue: #2962ff;
            --inv-bg: #f5f6f8; --inv-white: #ffffff; --inv-border: #e0e3eb;
            --inv-text: #333333; --inv-text-muted: #787b86; --inv-header: #1a1a1a;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--inv-bg); color: var(--inv-text); font-size: 13px; }
        a { text-decoration: none; color: inherit; }
        
        /* Header */
        .top-bar { background: var(--inv-header); color: #c5c5c5; font-size: 12px; padding: 6px 16px; display: flex; justify-content: space-between; }
        .main-header { background: var(--inv-white); border-bottom: 1px solid var(--inv-border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 32px; height: 32px; background: var(--inv-blue); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; }
        .logo-text h1 { font-size: 16px; font-weight: 700; }
        .logo-text p { font-size: 11px; color: var(--inv-text-muted); }
        .header-nav { display: flex; gap: 4px; margin-left: auto; }
        .nav-link { padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 4px; }
        .nav-link.active { background: var(--inv-blue); color: white; }

        /* Layout */
        .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
        .main-container { display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
        @media (max-width: 968px) { .main-container { grid-template-columns: 1fr; } }

        /* Panel & Table */
        .panel { background: var(--inv-white); border: 1px solid var(--inv-border); border-radius: 4px; margin-bottom: 16px; }
        .tab-bar { display: flex; border-bottom: 1px solid var(--inv-border); background: var(--inv-white); }
        .tab-btn { padding: 12px 20px; background: none; border: none; border-bottom: 3px solid transparent; font-size: 13px; font-weight: 600; color: var(--inv-text-muted); cursor: pointer; }
        .tab-btn.active { color: var(--inv-blue); border-bottom-color: var(--inv-blue); }
        
        .table-wrapper { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        .data-table th { background: #fafbfc; padding: 10px; text-align: left; font-size: 11px; color: var(--inv-text-muted); text-transform: uppercase; border-bottom: 1px solid var(--inv-border); }
        .data-table td { padding: 12px 10px; border-bottom: 1px solid var(--inv-border); vertical-align: middle; }
        .data-table tr:hover { background: #f9fafb; cursor: pointer; }
        
        .ticker-cell { display: flex; align-items: center; gap: 10px; }
        .ticker-logo { width: 32px; height: 32px; background: var(--inv-blue); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 11px; }
        .ticker-name-main { font-weight: 700; font-size: 14px; }
        .ticker-name-sub { font-size: 11px; color: var(--inv-text-muted); }
        
        .signal-badge { padding: 3px 8px; border-radius: 3px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .signal-buy { background: #e6f7ef; color: var(--inv-green); }
        .signal-sell { background: #fde8e9; color: var(--inv-red); }
        .signal-hold { background: #fff4e5; color: #b8860b; }
        .signal-no-data { background: #f0f2f5; color: var(--inv-text-muted); }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; border-radius: 4px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-header { background: var(--inv-header); color: white; padding: 24px; position: relative; }
        .modal-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.2); border: none; color: white; width: 30px; height: 30px; border-radius: 4px; cursor: pointer; }
        .modal-title { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .modal-subtitle { font-size: 14px; opacity: 0.8; margin-bottom: 16px; }
        .modal-price { font-size: 32px; font-weight: 700; }
        .modal-body { padding: 24px; }
        
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; border-bottom: 2px solid var(--inv-blue); padding-bottom: 8px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .metric-card { background: #f8f9fa; padding: 12px; border-radius: 4px; border: 1px solid var(--inv-border); }
        .metric-label { font-size: 11px; color: var(--inv-text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .metric-value { font-size: 18px; font-weight: 700; }
        .metric-sub { font-size: 11px; margin-top: 4px; font-weight: 600; }
        
        .change-pos { color: var(--inv-green); }
        .change-neg { color: var(--inv-red); }
        
        .error-box { background: #fde8e9; border: 1px solid var(--inv-red); padding: 20px; border-radius: 4px; text-align: center; color: #7a0f14; }

        /* Widget Sidebar */
        .widget { background: var(--inv-white); border: 1px solid var(--inv-border); border-radius: 4px; padding: 16px; margin-bottom: 16px; }
        .widget-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; border-bottom: 1px solid var(--inv-border); padding-bottom: 8px; }
        .widget-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px solid #f0f0f0; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>🔥 Coal Algo-Trader v1.0</span>
        <span id="last-update">Update: —</span>
    </div>

    <header class="main-header">
        <div class="logo">
            <div class="logo-icon">C</div>
            <div class="logo-text">
                <h1>Coal Algo-Trader</h1>
                <p>Dual-Engine System</p>
            </div>
        </div>
        <nav class="header-nav">
            <a href="index.html" class="nav-link active">Dashboard</a>
            <a href="position.html" class="nav-link">My Position</a>
        </nav>
    </header>

    <div class="container">
        <div class="main-container">
            <!-- Main Content -->
            <div>
                <div class="panel">
                    <div class="tab-bar">
                        <button class="tab-btn active" onclick="switchTab('swing')" id="tab-swing">⚡ Swing</button>
                        <button class="tab-btn" onclick="switchTab('dividend')" id="tab-dividend">💰 Dividen</button>
                        <button class="tab-btn" onclick="switchTab('all')" id="tab-all">📋 Semua</button>
                    </div>
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Saham</th>
                                    <th>Harga</th>
                                    <th>Sinyal</th>
                                    <th>Skor</th>
                                    <th>Info</th>
                                </tr>
                            </thead>
                            <tbody id="stock-table-body">
                                <tr><td colspan="5" style="text-align:center; padding: 20px;">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div>
                <div class="widget">
                    <div class="widget-title"> ICE Newcastle</div>
                    <div id="ice-price" style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">—</div>
                    <div id="ice-status" style="font-size: 12px; font-weight: 600;">Loading...</div>
                </div>
                <div class="widget">
                    <div class="widget-title">📈 Market Summary</div>
                    <div class="widget-row"><span>Total Tickers</span><span id="sum-tickers">0</span></div>
                    <div class="widget-row"><span>Buy Signals</span><span id="sum-buy" class="change-pos">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        let DATA = null;
        let CURRENT_TAB = 'swing';

        // Utilities
        const fmtRp = (num) => {
            if (!num || isNaN(num)) return '—';
            return 'Rp ' + Math.round(num).toLocaleString('id-ID');
        };
        const fmtPct = (num) => {
            if (num === null || num === undefined || isNaN(num)) return '—';
            return (num >= 0 ? '+' : '') + num.toFixed(2) + '%';
        };

        async function loadData() {
            try {
                const res = await fetch('coal_data.json?t=' + new Date().getTime());
                DATA = await res.json();
                renderAll();
            } catch (e) { console.error(e); }
        }

        function renderAll() {
            if (!DATA) return;
            
            // Update Header Info
            const ice = DATA.ice_newcastle || {};
            document.getElementById('ice-price').textContent = ice.current_price_usd ? '$' + ice.current_price_usd.toFixed(2) : '—';
            const iceStatus = document.getElementById('ice-status');
            if (ice.status === 'FAILED') {
                iceStatus.textContent = '⚠️ Data Gagal';
                iceStatus.style.color = 'var(--inv-red)';
            } else if (ice.above_floor) {
                iceStatus.textContent = '✅ Above Floor ($120)';
                iceStatus.style.color = 'var(--inv-green)';
            } else {
                iceStatus.textContent = '❌ Below Floor';
                iceStatus.style.color = 'var(--inv-red)';
            }

            if (DATA.metadata?.generated_at) {
                const d = new Date(DATA.metadata.generated_at);
                document.getElementById('last-update').textContent = 'Update: ' + d.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
            }

            document.getElementById('sum-tickers').textContent = DATA.summary?.total_tickers || 0;
            document.getElementById('sum-buy').textContent = DATA.summary?.swing_buy_signals || 0;

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('stock-table-body');
            let stocks = [];
            
            if (CURRENT_TAB === 'swing') stocks = DATA.swing_mode || [];
            else if (CURRENT_TAB === 'dividend') stocks = DATA.dividend_mode || [];
            else {
                // Merge unique tickers
                const map = new Map();
                [...(DATA.swing_mode||[]), ...(DATA.dividend_mode||[])].forEach(s => map.set(s.ticker, s));
                stocks = Array.from(map.values());
            }

            if (stocks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Tidak ada data.</td></tr>';
                return;
            }

            tbody.innerHTML = stocks.map(s => {
                const shortName = s.ticker.replace('.JK', '');
                const companyName = s.company_name || '';
                const sigClass = s.signal.includes('BUY') ? 'signal-buy' : s.signal.includes('SELL') ? 'signal-sell' : 'signal-no-data';
                
                return `
                <tr onclick="openModal('${s.ticker}')">
                    <td>
                        <div class="ticker-cell">
                            <div class="ticker-logo">${shortName.substring(0,2)}</div>
                            <div>
                                <div class="ticker-name-main">${shortName}</div>
                                <div class="ticker-name-sub">${companyName}</div>
                            </div>
                        </div>
                    </td>
                    <td style="font-weight:700;">${fmtRp(s.current_price)}</td>
                    <td><span class="signal-badge ${sigClass}">${s.signal.replace(/_/g,' ')}</span></td>
                    <td style="font-weight:700;">${s.composite_score?.toFixed(0) || 0}</td>
                    <td style="font-size:11px; color:var(--inv-text-muted);">Klik untuk detail →</td>
                </tr>`;
            }).join('');
        }

        function openModal(ticker) {
            const s = DATA.swing_mode.find(x => x.ticker === ticker) || DATA.dividend_mode.find(x => x.ticker === ticker);
            if (!s) return;

            const shortName = ticker.replace('.JK', '');
            const companyName = s.company_name || 'Unknown Company';
            const hasData = s.current_price && s.current_price > 0;

            let contentHtml = '';

            if (!hasData) {
                contentHtml = `
                    <div class="error-box">
                        <h3>⚠️ Data Tidak Tersedia</h3>
                        <p>Tidak ada data harga atau sinyal untuk <strong>${shortName}</strong> saat ini.</p>
                    </div>
                `;
            } else {
                // Swing Data
                if (s.mode === 'SWING' || s.signal.includes('BUY') || s.signal.includes('SELL')) {
                    const tp = s.target_profit || 0;
                    const sl = s.stop_loss || 0;
                    // Safe calculation to prevent NaN
                    const tpPct = s.current_price ? ((tp / s.current_price - 1) * 100) : 0;
                    const slPct = s.current_price ? ((sl / s.current_price - 1) * 100) : 0;
                    const rsi = s.technical?.rsi || 0;
                    const vol = s.volume_sentiment?.volume_ratio || 0;

                    contentHtml += `
                        <div class="section-title">⚡ Swing Analysis</div>
                        <div class="metrics-grid">
                            <div class="metric-card">
                                <div class="metric-label">Target Profit</div>
                                <div class="metric-value change-pos">${fmtRp(tp)}</div>
                                <div class="metric-sub change-pos">+${tpPct.toFixed(1)}%</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-label">Stop Loss</div>
                                <div class="metric-value change-neg">${fmtRp(sl)}</div>
                                <div class="metric-sub change-neg">${slPct.toFixed(1)}%</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-label">RSI (14)</div>
                                <div class="metric-value">${rsi.toFixed(1)}</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-label">Vol Ratio</div>
                                <div class="metric-value">${vol.toFixed(2)}x</div>
                            </div>
                        </div>
                    `;
                }

                // Dividend Data
                if (s.mode === 'DIVIDEND' || s.signal.includes('ACCUMULATE')) {
                    const yieldPct = s.forward_yield_pct || 0;
                    const der = s.fundamental_safety?.details?.der || 0;
                    
                    contentHtml += `
                        <div class="section-title"> Dividend Analysis</div>
                        <div class="metrics-grid">
                            <div class="metric-card">
                                <div class="metric-label">Forward Yield</div>
                                <div class="metric-value change-pos">${yieldPct.toFixed(2)}%</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-label">DER</div>
                                <div class="metric-value">${der.toFixed(2)}</div>
                            </div>
                        </div>
                    `;
                }
            }

            document.getElementById('modal-body').innerHTML = `
                <div class="modal-header">
                    <button class="modal-close" onclick="closeModal()">✕</button>
                    <div class="modal-title">${shortName}</div>
                    <div class="modal-subtitle">${companyName} • ${ticker}</div>
                    <div style="display:flex; align-items:center; gap:16px; margin-top:16px;">
                        <div class="modal-price">${fmtRp(s.current_price)}</div>
                        <span class="signal-badge ${s.signal.includes('BUY')?'signal-buy':'signal-no-data'}" style="font-size:14px; padding:6px 12px;">${s.signal.replace(/_/g,' ')}</span>
                    </div>
                </div>
                <div class="modal-body">
                    ${contentHtml}
                </div>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function switchTab(tab) {
            CURRENT_TAB = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-'+tab).classList.add('active');
            renderTable();
        }

        loadData();
    </script>
</body>
</html>
